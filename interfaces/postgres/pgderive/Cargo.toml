[package]
name = "irox-pgderive"
description = "Derive macros for irox-postgres"
keywords = ["irox", "derive", "postgres"]
categories = ["database"]
version= "0.1.0"
edition.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true
exclude.workspace = true
repository.workspace = true
readme = "README.md"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
proc-macro = true

[dependencies]
irox-derive-helpers = {workspace = true, features = ["syn"]}
irox-tools = {workspace = true, features = ["std"]}
